name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web-unit:
    name: Web Protocol & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JS syntax
        run: |
          node --check web/core.js
          node --check web/app.js
      - name: Run Node unit tests
        run: node --test tests/core.test.mjs

  rust-unit:
    name: Rust Fmt, Test & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy -- -D warnings

  rust-integration:
    name: Desktop Integration Tests
    runs-on: ubuntu-latest
    needs: [rust-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build
      - run: python3 tests/integration.py

  android-unit:
    name: Android JVM Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew
      - name: Run JVM unit tests (skip native .so build)
        run: ./gradlew :app:testDebugUnitTest -PskipRustBuild=true

  android-build:
    name: Android APK with Rust arm64-v8a JNI
    runs-on: ubuntu-latest
    needs: [rust-unit, android-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"
      - name: Build Debug APK (requires libfluorine.so)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug
      - name: Verify libfluorine.so is packaged in APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libfluorine.so'
