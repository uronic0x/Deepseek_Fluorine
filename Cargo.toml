[package]
name = "fluorine"
version = "0.3.2"
edition = "2021"
license = "MIT"
description = "Minimal auditable DeepSeek Chat / Work client with local computation and tool calling"

[lib]
name = "fluorine"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fluorine"
path = "src/main.rs"

[dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
